
name: FX daily paper trading

on:
  schedule:
    - cron: '20 23 * * 0-4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fx-paper
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fx_cloud.py
      - name: Save paper ledger and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json docs/latest.json
          git diff --cached --quiet || (git commit -m "Update FX paper ledger" && git push)
