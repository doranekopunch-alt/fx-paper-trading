<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FX 仮想運用</title><style>body{font-family:system-ui,sans-serif;background:#06142b;color:#f5f7fc;margin:0;padding:22px}main{max-width:620px;margin:auto}section{background:#142744;border-radius:15px;padding:20px;margin:14px 0}h1{font-size:24px}.num{font-size:36px;font-weight:750}small,.muted{color:#afc1d9}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px 6px;border-bottom:1px solid #354663}th{font-size:13px;color:#afc1d9}a{color:#b9dcff}.err{color:#ffc9aa}</style></head><body><main><h1>FX 仮想運用</h1><p class="muted">研究用・実際の売買なし・1倍想定</p><section><small>仮想残高（初期資金 10,000円）</small><div class="num" id="total">読み込み中…</div><p id="pnl"></p><small id="updated"></small></section><section><h2>通貨ペア別</h2><table><thead><tr><th>通貨</th><th>データ日付</th><th>判定</th><th>仮想残高</th></tr></thead><tbody id="rows"></tbody></table></section><section><h2>最近の記録</h2><div id="history"></div></section><p id="warnings" class="err"></p><small>20/60日移動平均、翌日反映。3通貨に各3,333.33円を均等配分。売買コストは概算2pips。スワップ・税金・スリッページ未反映。結果は予測や利益保証ではありません。初回は残高1万円から開始します。</small></main><script>const fmt=n=>Number(n).toLocaleString("ja-JP",{maximumFractionDigits:2});fetch("./latest.json?ts="+Date.now()).then(r=>{if(!r.ok)throw Error("データがありません");return r.json()}).then(d=>{document.getElementById("total").textContent=fmt(d.total_jpy)+"円";document.getElementById("pnl").textContent="開始時から "+(d.pnl_jpy>=0?"+":"")+fmt(d.pnl_jpy)+"円";document.getElementById("updated").textContent="最終確認 "+d.generated_at;document.getElementById("rows").innerHTML=Object.entries(d.pairs).map(([k,v])=>`<tr><td>${k}</td><td>${v.date||"—"}</td><td>${v.signal||"更新失敗"}</td><td>${fmt(v.balance_jpy)}円</td></tr>`).join("");document.getElementById("history").innerHTML=d.history.slice(-12).reverse().map(x=>`<p>${x.date}　${x.pair}　${fmt(x.balance_jpy)}円</p>`).join("")||"まだ記録はありません";document.getElementById("warnings").textContent=d.warnings.join(" / ");}).catch(e=>document.getElementById("total").textContent="未設定：初回実行後に表示");</script></body></html>
